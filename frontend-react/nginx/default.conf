map $http_x_forwarded_proto $proxy_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json application/wasm image/svg+xml text/css text/javascript;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /health/ {
    proxy_pass http://web:8000/health/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files /manifest.webmanifest =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /sw.js =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /bancos/enable-banking/callback/ {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ^~ /api/recovery/restore/ {
    client_max_body_size 2g;
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /adjuntos/ {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /exportar/ {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
